name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  # Fast gate: the unit suite covers the reconciliation table, deletion and
  # conflict handling, so a failing test stops the matrix before four binaries
  # are produced. Vendor mode is pinned so the runner never needs the local
  # fork checkouts referenced by go.mod's replace directives (the committed
  # vendor/ tree is the source of truth; see TESTING.md).
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Vet
        run: go vet -mod=vendor ./...

      - name: Test
        run: go test -mod=vendor ./...

  build:
    name: ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-0-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -mod=vendor \
              -ldflags "-X main.version=${{ steps.ver.outputs.version }}" \
              -o tessera-${{ matrix.target }}${{ matrix.ext }} .

      - uses: actions/upload-artifact@v4
        with:
          name: tessera-${{ matrix.target }}
          path: tessera-${{ matrix.target }}${{ matrix.ext }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      # The installers verify against this file; it must list the bare asset
      # names (download-artifact puts each asset in its own tessera-<target>/
      # directory, so strip that prefix).
      - name: Generate SHA256SUMS
        run: |
          sha256sum tessera-*/* | sed -E 's#  tessera-[^/]*/#  #' > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tessera-*/*
            SHA256SUMS
          generate_release_notes: true